{% extends 'core/base.html' %}{% block body %}
<main id="main" class="main login-page">
<section class="login-card"><h1>{{ui.login_title}}</h1><p data-login-message="1">{{message}}</p>
<form method="post">{% csrf_token %}<label>{{ui.common_username}} <input name="username" autocomplete="username" required></label><label>{{ui.common_password}} <input name="password" type="password" autocomplete="current-password" required></label><button>{{ui.login_submit}}</button></form>
<a href="/activate">{{ui.login_invite}}</a></section>
</main>{% endblock %}
