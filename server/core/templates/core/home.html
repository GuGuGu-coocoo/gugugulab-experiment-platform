{% extends 'core/base.html' %}{% block content %}<h1>我的研究</h1><p>创建研究、登记实验、批准合成发行，并核对采集状态。</p>{% for study in studies %}<article><h2><a href="/studies/{{study.id}}">{{study.title}}</a></h2><small>{{study.recruitment}} · {{study.mode}}</small></article>{% empty %}<p>当前没有获授权研究。</p>{% endfor %}<section><h2>创建研究</h2><form method="post">{% csrf_token %}<input name="title" placeholder="研究名称" maxlength="160" required><button>创建</button></form></section><form action="/logout" method="post">{% csrf_token %}<button>退出登录</button></form>{% endblock %}
