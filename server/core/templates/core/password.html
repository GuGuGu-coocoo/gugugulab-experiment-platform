{% extends 'core/base.html' %}{% block content %}<section><h1>{{ui.password_title}}</h1>
{% if must_change %}<div class="notice" role="status" aria-live="polite">{{ui.password_must_change}}</div>{% endif %}
{% if error %}<div class="error" role="alert">{{error}}</div>{% endif %}
<form method="post">{% csrf_token %}
<label>{{ui.password_current}} <input type="password" name="current" autocomplete="current-password" required></label>
<label>{{ui.password_new}} <input type="password" name="new" minlength="6" autocomplete="new-password" required></label>
<label>{{ui.password_confirm}} <input type="password" name="confirm" minlength="6" autocomplete="new-password" required></label>
<button>{{ui.password_save}}</button></form>
<form action="/logout" method="post">{% csrf_token %}<button class="secondary">{{ui.nav_logout}}</button></form></section>{% endblock %}
