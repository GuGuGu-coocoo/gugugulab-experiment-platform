{% extends 'core/base.html' %}{% block content %}<section><h1>修改密码</h1>
{% if must_change %}<div class="notice">当前使用临时密码登录，必须设置新密码后才能继续使用后台。</div>{% endif %}
{% if error %}<div class="error" role="alert">{{error}}</div>{% endif %}
<form method="post">{% csrf_token %}
<label>当前密码（临时密码）<input type="password" name="current" autocomplete="current-password" required></label>
<label>新密码（至少 16 字符）<input type="password" name="new" minlength="16" autocomplete="new-password" required></label>
<label>确认新密码 <input type="password" name="confirm" minlength="16" autocomplete="new-password" required></label>
<button>保存新密码</button></form>
<form action="/logout" method="post">{% csrf_token %}<button>退出登录</button></form></section>{% endblock %}
