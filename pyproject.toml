[project]
name = "gep"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["Django>=5.2,<5.3", "jsonschema>=4.23,<5", "gunicorn>=23,<24"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-django>=4.9,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gep.settings"
pythonpath = ["server"]
testpaths = ["tests"]
