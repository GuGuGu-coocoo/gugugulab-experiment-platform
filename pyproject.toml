[project]
name = "gep"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2.18,<5.3",
    "jsonschema>=4.23,<5",
    "gunicorn>=25.3,<26",
    "openpyxl==3.1.5",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<9.1", "pytest-django>=4.9,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gep.settings"
pythonpath = ["server"]
testpaths = ["tests"]
